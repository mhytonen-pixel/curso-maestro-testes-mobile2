appId: com.curso.shopdemo
env:
    EMAIL: ${EMAIL || "cliente@shopdemo.com"}
    SENHA: ${SENHA || "123456"}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
        id: "input-email"
    timeout: 40000
- tapOn: "input-email"
- inputText: ${EMAIL}
- tapOn: "input-senha"
- inputText: ${SENHA}

- hideKeyboard
- tapOn: "btn-entrar"

- extendedWaitUntil:
    visible: 
        id: "tela-catalogo"
    timeout: 40000
- assertVisible:
    id: "tela-catalogo"
